name: Omniscience - fast diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-26
            args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release
          - name: Windows x64
            os: windows-2022
            args: -A x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build ${{ matrix.args }}
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render 270 presets and verify processor state
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/CosmosPresetQA.exe
          else
            ./build/CosmosPresetQA
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cosmos-preset-QA-${{ matrix.name }}
          path: |
            cosmos-presets.csv
            cosmos-processor-qualification.csv
            cosmos-preset-audio/
            cosmos-ui-qa/
          if-no-files-found: warn
      - name: Filter professional qualification
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/CosmosFilterQA.exe
          else
            ./build/CosmosFilterQA
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cosmos-filter-QA-${{ matrix.name }}
          path: |
            cosmos-filter-quality.csv
            cosmos-filter-response.csv
            cosmos-filter-routing.csv
            cosmos-filter-summary.csv
            cosmos-filter-resonance.csv
            cosmos-filter-alias-probe.csv
          if-no-files-found: warn
      - name: DSP benchmark
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/CosmosBenchmark.exe > cosmos-benchmark.csv
          else
            ./build/CosmosBenchmark > cosmos-benchmark.csv
          fi
          cat cosmos-benchmark.csv
      - name: DSP endurance (60 seconds rendered audio per scenario)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/CosmosBenchmark.exe --long > cosmos-endurance.csv
          else
            ./build/CosmosBenchmark --long > cosmos-endurance.csv
          fi
          cat cosmos-endurance.csv
      - name: Modulation benchmark and endurance
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build/Release/CosmosBenchmark.exe --modulation > cosmos-modulation-performance.csv
          else
            ./build/CosmosBenchmark --modulation > cosmos-modulation-performance.csv
          fi
          cat cosmos-modulation-performance.csv
      - uses: actions/upload-artifact@v4
        with:
          name: Cosmos-benchmark-${{ matrix.name }}
          path: |
            cosmos-benchmark.csv
            cosmos-endurance.csv
            cosmos-modulation-performance.csv
          if-no-files-found: error
      - name: Package macOS development binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd build/Omniscience_artefacts/Release
          test -d AU/Omniscience.component
          test -d VST3/Omniscience.vst3
          test -d Standalone/Omniscience.app
          for binary in AU/Omniscience.component/Contents/MacOS/Omniscience VST3/Omniscience.vst3/Contents/MacOS/Omniscience Standalone/Omniscience.app/Contents/MacOS/Omniscience; do
            lipo "$binary" -verify_arch arm64
          done
          mkdir -p "$RUNNER_TEMP/omniscience"
          ditto AU/Omniscience.component "$RUNNER_TEMP/omniscience/Omniscience.component"
          ditto VST3/Omniscience.vst3 "$RUNNER_TEMP/omniscience/Omniscience.vst3"
          ditto Standalone/Omniscience.app "$RUNNER_TEMP/omniscience/Omniscience.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/omniscience" "$GITHUB_WORKSPACE/Omniscience-macOS-ARM64.zip"
      - name: Package Windows development binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "build/Omniscience_artefacts/Release"
          $vst = "$root/VST3/Omniscience.vst3"
          $exe = "$root/Standalone/Omniscience.exe"
          if (!(Test-Path $vst) -or !(Test-Path $exe)) { throw "Missing plugin binaries" }
          Compress-Archive -Path $vst,$exe -DestinationPath Omniscience-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Omniscience-v0.5.6-macOS-ARM64
          path: Omniscience-macOS-ARM64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Omniscience-v0.5.6-Windows-x64
          path: Omniscience-Windows-x64.zip
          if-no-files-found: error
